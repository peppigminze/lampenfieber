<style>

  --panel: rgba(18, 13, 34, 0.9); --line: rgba(255, 207, 135, 0.2); --btn: rgba(255, 207, 135, 0.07); --btn-line: rgba(255, 207, 135, 0.24);
  --primary: #ffcf87; --primary-text: #1b1330; --scrim: rgba(8, 5, 16, 0.5); --accent: #ffcf87;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }

#ui.screen-title { background: radial-gradient(ellipse at 50% 40%, rgba(8, 5, 16, 0.15), rgba(8, 5, 16, 0.65)); }
.panel { width: min(100%, 31rem); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1.4rem 1.4rem 1.2rem; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

p { margin: 0.4rem 0; max-width: 62ch; }

.title-wrap { text-align: center; width: min(100%, 26rem); }
.title { margin: 0; font: 400 clamp(3.1rem, 15vw, 6.6rem)/0.95 var(--display); letter-spacing: -0.01em; }
.title span { background: radial-gradient(circle at 50% 55%, #fff6dd 0%, #ffcf87 9%, #d0906a 19%, #9a86c4 34%, #7d6aa8 60%); background-size: 300% 100%; background-position: 100% 50%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 7s ease-in-out infinite alternate; filter: drop-shadow(0 0 18px rgba(255, 190, 110, 0.25)); }

.menu { display: grid; gap: 0.55rem; }
.menu button, .actions button, .shop button { background: var(--btn); border: 1px solid var(--btn-line); border-radius: 2px; padding: 0.7rem 1rem; text-align: center; transition: background 0.15s, transform 0.1s; }
.screen-title .menu button { background: rgba(18, 13, 34, 0.72); color: #f3e6cf; border-color: rgba(255, 207, 135, 0.28); }
.screen-title .menu button small { color: rgba(243, 230, 207, 0.6); }

.menu button:active:not([disabled]) { transform: scale(0.98); }

.screen-title .menu button.primary { background: #ffcf87; color: #1b1330; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: flex-end; margin-top: 1.2rem; }
.actions.center { justify-content: center; }

.lanterns { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.6rem; }
.lantern { text-align: left; background: var(--btn); border: 1px solid var(--btn-line); border-left: 4px solid var(--lc); border-radius: 2px; padding: 0.75rem 0.9rem; display: grid; gap: 0.2rem; }
.lantern.on { background: rgba(255, 207, 135, 0.18); box-shadow: inset 0 0 0 1px var(--lc); }
.lname { font: 400 1.25rem var(--display); }
.ldesc { font-size: 0.86rem; color: var(--muted); }
.grades { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
.grades button { background: var(--btn); border: 1px solid var(--btn-line); border-radius: 2px; padding: 0.35rem 0.8rem; min-width: 3rem; }
.grades button.on { background: var(--primary); color: var(--primary-text); }

.cards-wrap { width: min(100%, 52rem); background: transparent; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; text-align: center; }
.cards-wrap h2 { color: #f3e6cf; text-shadow: 0 2px 12px #000; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .card { grid-template-columns: 3rem 1fr; text-align: left; } .card .cicon { grid-row: span 3; } }
.card { position: relative; display: grid; gap: 0.3rem; align-content: start; justify-items: center; padding: 1.1rem 0.9rem 1rem; background: rgba(18, 13, 34, 0.94); color: #f3e6cf; border: 1px solid rgba(243, 230, 207, 0.25); border-radius: 6px 6px 2px 2px; text-align: center; transition: transform 0.12s, box-shadow 0.12s; animation: dealt 0.35s cubic-bezier(.2, .9, .3, 1.3) backwards; }
.card:nth-child(2) { animation-delay: 0.06s; } .card:nth-child(3) { animation-delay: 0.12s; }
@keyframes dealt { from { transform: translateY(30px) rotate(-3deg); opacity: 0; } }
.card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(255, 190, 110, 0.25); }
.card .cicon { font-size: 2rem; line-height: 1; color: #ffcf87; }
.card .cname { font: 400 1.3rem var(--display); }
.card .crar { font-size: 0.75rem; font-style: italic; color: rgba(243, 230, 207, 0.6); }
.card .cdesc { font-size: 0.92rem; }
.card kbd { position: absolute; top: 0.4rem; right: 0.5rem; font: 0.7rem var(--body); opacity: 0.4; }
.card.rar-rare { border-color: rgba(201, 184, 255, 0.6); } .card.rar-rare .cicon { color: #c9b8ff; }
.card.rar-epic { border-color: #ffcf87; box-shadow: 0 0 24px rgba(255, 207, 135, 0.3); } .card.rar-epic .crar { color: #ffcf87; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin: 0.8rem 0; }
.kv.cols { grid-template-columns: auto 1fr auto 1fr; }
@media (max-width: 560px) { .kv.cols { grid-template-columns: auto 1fr; } }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.score { font: 400 3rem/1 var(--display); margin: 0.2rem 0 0.4rem; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; margin-left: 0.6rem; font: italic 0.85rem var(--body); vertical-align: middle; color: var(--accent); border: 1px solid currentColor; padding: 0.1rem 0.5rem; border-radius: 2px; }
.over.won h2 { color: var(--accent); }
.unlock { color: var(--accent); font-style: italic; }
.achlist { padding-left: 1.1rem; margin: 0.3rem 0; } .achlist li { margin: 0.3rem 0; }
.kniffe { list-style: none; padding: 0; margin: 0.8rem 0; display: flex; flex-wrap: wrap; gap: 0.35rem; }
.kniffe li { background: var(--btn); border: 1px solid var(--line); padding: 0.15rem 0.5rem; border-radius: 2px; font-size: 0.85rem; }
.kicon { margin-right: 0.3rem; color: var(--accent); }
.interlude { text-align: center; } .interlude .kv { text-align: left; max-width: 20rem; margin: 0.8rem auto; }
.next { margin-top: 1rem; }

.glut { font: 400 2rem var(--display); margin: 0; color: var(--accent); }
.shop { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0.5rem; }
.shop li { display: flex; gap: 0.8rem; align-items: center; justify-content: space-between; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.shop li > div { display: grid; gap: 0.1rem; }
.shop li.maxed { opacity: 0.6; }
.shop button { white-space: nowrap; min-width: 6.5rem; }
.pips { display: inline-flex; gap: 3px; margin-left: 0.5rem; } .pips i { width: 8px; height: 8px; border: 1px solid var(--accent); border-radius: 50%; } .pips i.on { background: var(--accent); }
.achgrid, .bestiary { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 0.5rem; }
.achgrid li, .bestiary li { position: relative; display: grid; gap: 0.15rem; padding: 0.6rem 0.75rem; border: 1px solid var(--line); border-radius: 2px; opacity: 0.6; }
.achgrid li.ok { opacity: 1; border-color: var(--accent); }
.bestiary li { opacity: 1; padding-right: 2.6rem; } .bestiary li.unseen { opacity: 0.45; }
.bestiary li.pol-L { border-left: 3px solid #ffd36b; } .bestiary li.pol-S { border-left: 3px solid #4b3a7a; } .bestiary li.pol-X { border-left: 3px solid #c9b8ff; }
.bestiary .cnt { position: absolute; top: 0.55rem; right: 0.7rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.scroll { overflow-x: auto; }
.hs { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.hs th, .hs td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
.hs th { font-weight: 400; color: var(--muted); }
.tog { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.tog input[type="checkbox"] { width: 1.3rem; height: 1.3rem; accent-color: #b0705a; }
.tog input[type="range"] { width: 45%; accent-color: #b0705a; }
.tog select { font: inherit; background: var(--btn); color: var(--text); border: 1px solid var(--btn-line); border-radius: 2px; padding: 0.25rem 0.4rem; }
.howto .rule { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.9rem; align-items: center; margin: 0.7rem 0; }
.howto svg { width: 100%; background: #1d1a33; border-radius: 2px; }

/* in-game chrome */
.iconbtn { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 207, 135, 0.3); background: rgba(18, 13, 34, 0.6); color: #f3e6cf; font-size: 0.8rem; touch-action: manipulation; }
#pad { position: fixed; z-index: 6; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; gap: 14px; align-items: flex-end; touch-action: none; }
.hand-left #pad { right: auto; left: calc(env(safe-area-inset-left, 0px) + 18px); flex-direction: row-reverse; }
.ab { --cd: 0; position: relative; width: 74px; height: 74px; border-radius: 50%; border: 1px solid rgba(255, 207, 135, 0.4); background: rgba(18, 13, 34, 0.55); color: #f3e6cf; display: grid; place-items: center; overflow: hidden; touch-action: none; }
.ab.flare { width: 88px; height: 88px; }
.ab::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(8, 5, 16, 0.78) calc(var(--cd) * 360deg), transparent 0); pointer-events: none; }
.ab.ready.flare { box-shadow: 0 0 22px rgba(255, 207, 135, 0.55), inset 0 0 14px rgba(255, 207, 135, 0.3); }
.ab.ready.douse { box-shadow: 0 0 22px rgba(160, 130, 255, 0.5), inset 0 0 14px rgba(160, 130, 255, 0.3); }
.ab .ico { font-size: 2rem; line-height: 1; position: relative; }
.ab .key { position: absolute; bottom: 8px; font-size: 0.6rem; opacity: 0.6; }
@media (pointer: coarse) { .ab .key { display: none; } }
@media (pointer: fine) { .ab { width: 60px; height: 60px; opacity: 0.85; } .ab.flare { width: 68px; height: 68px; } .ab .ico { font-size: 1.5rem; } }
#hint { position: fixed; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 130px); transform: translate(-50%, 12px); width: min(92vw, 27rem); padding: 0.7rem 1rem; background: rgba(18, 13, 34, 0.88); color: #f3e6cf; border: 1px solid rgba(255, 207, 135, 0.3); border-radius: 2px; text-align: center; font-size: 0.98rem; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
#hint.on { opacity: 1; transform: translate(-50%, 0); }
#banner { position: fixed; z-index: 7; left: 0; right: 0; top: 30%; text-align: center; color: #f3e6cf; pointer-events: none; opacity: 0; }
#banner small { font: italic 1rem var(--body); color: rgba(243, 230, 207, 0.75); }
#banner span { display: block; font: 400 clamp(2.4rem, 10vw, 4.6rem)/1 var(--display); text-shadow: 0 0 30px rgba(255, 190, 110, 0.45); }
#banner.on { animation: banner 2.8s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; letter-spacing: 0.3em; } 18% { opacity: 1; letter-spacing: 0.02em; } 75% { opacity: 1; } 100% { opacity: 0; } }

.curtain { position: fixed; z-index: 30; top: 0; bottom: 0; width: 51vw; pointer-events: none; transition: transform 0.85s cubic-bezier(.7, 0, .25, 1); background: repeating-linear-gradient(90deg, #3d0712 0, #7a1426 2.2vw, #5a0d1c 4.4vw, #3d0712 6.4vw); box-shadow: inset 0 -40px 60px rgba(0, 0, 0, 0.5); }
#curtainL { left: 0; transform: translateX(-102%); } #curtainR { right: 0; transform: translateX(102%); }
#curtainL.closed, #curtainR.closed { transform: translateX(0); }
#curtainL::after, #curtainR::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(90deg, #c99a3e 0 6px, #8a6420 6px 12px); }

@media (prefers-reduced-motion: reduce) {
  .title span { animation: none; background-position: 50% 50%; }
  .curtain { transition-duration: 0.01s; }
  .card { animation: none; }
  #banner.on { animation-duration: 2.8s; animation-name: fadeonly; }

}
</style>

      case 'nextact': if (G.run && nextAct(G.run)) { curtain(false); au.setMusic(G.run.act.music, 'run'); drain(G.run, au); to(G.run.choices ? 'levelup' : 'run'); } break;
      case 'totitle': G.run = null; to('title'); break;
      case 'toselect': G.run = null; to('select'); break;
      case 'again': startRun(G.sel.mode); break;
      case 'buy': if (buy(data, m, arg)) { save(); au.sfx('pick'); show('workshop'); } break;
      case 'set': {
        const s = m.settings;
        if (el.type === 'checkbox') s[arg] = el.checked; else if (el.type === 'range') s[arg] = +el.value; else s[arg] = el.value;
        applySettings(); save(); break;
      }
      case 'wipe': if (window.confirm('Spielstand, Glut und Erfolge wirklich löschen?')) { G.meta = wipeMeta(); G.sel.lantern = 'oellampe'; G.sel.grade = 0; applySettings(); to('title'); } break;
      default: break;
    }
  }

  function hideHint() { hint.classList.remove('on'); G.hintT = 0; }
  function queueHint(key, tut) {
    const s = G.meta.settings;
    if (!s.hints) return;
    if (!tut && G.meta.hints[key]) return;
    if (!tut) G.meta.hints[key] = true;
    const txt = hintText(key, data, device());
    if (txt && !G.hintQ.includes(txt)) G.hintQ.push(txt);
  }
  function tickHint(dt) {
    if (G.hintT > 0) { G.hintT -= dt; if (G.hintT <= 0) hideHint(); return; }
    if (G.hintQ.length && G.app.screen === 'run') { hint.textContent = G.hintQ.shift(); hint.classList.add('on'); G.hintT = Math.max(4.5, hint.textContent.length / 14); }
  }
  function showBanner(small, big) {
    banner.innerHTML = `<small>${small}</small><span>${big}</span>`;
    banner.classList.remove('on'); void banner.offsetWidth; banner.classList.add('on');
  }

  const hooks = {
    levelup: () => {},
    banner: (name, what) => showBanner(what, name),
    actclear: () => { setTimeout(() => curtain(true), 200); },
    win: () => { G.overAt = performance.now() + 1800; input.enabled = false; },
    gameover: () => { G.overAt = performance.now() + 1500; input.enabled = false; },
    hint: (e) => queueHint(e.key, e.tut),
    act: (e) => { G.hintQ.length = 0; hideHint(); const a = G.run && G.run.act; if (a) showBanner(G.run.mode === 'encore' ? 'Zugabe' : a.sub, a.name); },
  };

  function drain(run, audio) {
    if (!run.ev.length) return;
    if (run === G.run) {
      for (const e of run.ev) if (e.type === 'spawn' && !e.boss && !G.meta.seen[e.id] && !G.newShown[e.id] && !['funke', 'schemen'].includes(e.id)) { G.newShown[e.id] = true; queueHint('new_' + e.id); }
      handleEvents(run, run.ev, fx, audio, hooks);
    } else handleEvents(run, run.ev, fx, MUTE, {});
    run.ev.length = 0;
  }

  let attractN = 0;
  function newAttract() {
    const r = createRun(data, { seed: (Math.random() * 1e9) | 0, workshop: { schatten: 5, licht: 5 } });
    setupAct(r, attractN++ % data.acts.acts.length);
    r.stacks.mondstein = 2; r.stacks.docht = 1; r.stats.orbit = 2; r.stats.radius *= 1.12;
    r.ev.length = 0; G.attract = r; G.attractT = 0;
  }

  input.onKey = (e) => {
    const sc = G.app.screen;
    if (sc === 'run') { if (e.code === 'Escape' || e.code === 'KeyP') pause(); return; }
    if (sc === 'levelup') {
      const i = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code);
      if (i >= 0) onAction('choose', i);
      if (e.code === 'KeyR') onAction('reroll');
      return;
    }
    if (e.code === 'Escape') {
      if (sc === 'pause') onAction('resume');
      else if (sc === 'select' || ['workshop', 'achievements', 'stats', 'howto', 'settings'].includes(sc)) onAction('back');
      return;
    }
    if (e.code === 'ArrowDown' || e.code === 'ArrowUp' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') moveFocus(e.code === 'ArrowDown' || e.code === 'ArrowRight' ? 1 : -1);
  };
  input.onPad = (b) => {
    const sc = G.app.screen;
    if (sc === 'run') { if (b === 9) pause(); return; }
    input.lastDevice = 'pad';
    if (b === 12 || b === 14) moveFocus(-1);
    if (b === 13 || b === 15) moveFocus(1);
    if (b === 0 && document.activeElement && document.activeElement.closest('#ui')) document.activeElement.click();
    if (b === 1 || b === 9) { if (sc === 'pause') onAction('resume'); else if (sc !== 'title' && sc !== 'levelup' && sc !== 'over' && sc !== 'interlude') onAction('back'); }
  };
  function moveFocus(d) {
    const list = [...document.querySelectorAll('#ui button:not([disabled]), #ui input, #ui select')];
    if (!list.length) return;
    const i = list.indexOf(document.activeElement);
    list[(i + d + list.length) % list.length].focus();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pointerdown', () => au.init(), { once: true });
  window.addEventListener('keydown', () => au.init(), { once: true });

  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function resize() {
    const cs = getComputedStyle(probe);
    const safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const dpr = Math.min(window.devicePixelRatio || 1, G.meta.settings.fx === 'niedrig' ? 1.25 : 2);
    R.resize(window.innerWidth, window.innerHeight, dpr, safe);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  function setCd(i, el, v) { const q = Math.round(v * 50) / 50; if (G.cdCache[i] !== q) { G.cdCache[i] = q; el.style.setProperty('--cd', q); el.classList.toggle('ready', q <= 0); } }
  const bF = $('#btnFlare'), bD = $('#btnDouse');

  function frame(now) {
    const rdt = Math.min(0.1, (now - G.last) / 1000);
    G.last = now; G.t += rdt;
    fx.update(rdt);
    let sdt = rdt * fx.slow;
    if (fx.freeze > 0) { fx.freeze -= rdt; sdt = 0; }
    const sc = G.app.screen;
    let shown = null;
    const pt0 = performance.now();
    if (G.run && ['run', 'levelup', 'pause', 'interlude', 'over'].includes(sc)) {
      const run = G.run;
      shown = run;
      if (sc === 'run') {
        const inp = input.read();
        if (inp.flare) G.pend.flare = true;
        if (inp.douse) G.pend.douse = true;
        G.acc += sdt;
        let n = 0;
        while (G.acc >= STEP && n < 6) {
          step(run, { mx: inp.mx, my: inp.my, flare: G.pend.flare, douse: G.pend.douse }, STEP);
          G.pend.flare = G.pend.douse = false;
          G.acc -= STEP; n++;
          drain(run, au);
          if (run.choices || run.phase === 'interlude') break;
        }
        if (n === 6) G.acc = 0;
        tickJuice(run, fx, sdt);
        if (run.choices && G.app.screen === 'run' && !G.overAt) to('levelup');
        else if (run.phase === 'interlude' && G.app.screen === 'run') to('interlude');
        const s = run.stats, p = run.p;
        setCd(0, bF, Math.max(0, p.flareCd / s.flareCd));
        setCd(1, bD, Math.max(0, p.douseCd / (s.douseCd + s.douseDur)));
        au.setMusic(null, run.phase === 'boss' ? 'boss' : 'run');
        au.setFever(run.feverTier);
      }
      if (G.overAt && now >= G.overAt) finishRun();
    } else {
      if (!G.attract) newAttract();
      const r = G.attract;
      shown = r;
      G.attractT += rdt;
      r.p.flame = r.stats.maxFlame; r.p.inv = 1;
      if (r.choices) choose(r, botChoose(r, G.bot));
      step(r, botInput(r, G.bot, STEP), STEP);
      drain(r, MUTE);
      tickJuice(r, fx, rdt);
      if (G.attractT > 40 || (r.phase !== 'play' && r.phase !== 'boss')) newAttract();
    }
    const pt1 = performance.now();
    if (shown && shown.ctx) {
      R.render(shown, { t: G.t, dt: rdt, fx, settings: G.meta.settings, snap: false });
      if (shown === G.run) R.hud(shown, { t: G.t, joy: input.joy });
    }
    const pt2 = performance.now();
    G.perf = G.perf || { sim: 0, draw: 0 };
    G.perf.sim += (pt1 - pt0 - G.perf.sim) * 0.05; G.perf.draw += (pt2 - pt1 - G.perf.draw) * 0.05;
    tickHint(rdt);
    requestAnimationFrame(frame);
  }

  applySettings();
  to('title');
  setTimeout(() => curtain(false), 120);
  document.body.classList.add('ready');
  window.__G = G;
  requestAnimationFrame(frame);
}

boot().catch((e) => {
  console.error(e);
  const el = document.getElementById('ui');
  if (el) { el.hidden = false; el.innerHTML = `<div class="panel"><h2>Die Lampe will nicht brennen</h2><p>${String(e && e.message || e)}</p><p class="fine">Lade die Seite neu. Hilft das nicht, lösche den Spielstand im Browser.</p></div>`; }
});

return {  };
})();
</script>
</body>
