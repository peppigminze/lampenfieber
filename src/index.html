<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d22">
<meta name="description" content="Lampenfieber: ein Schattentheater in fünf Akten.">
<title>Lampenfieber</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage" aria-label="Spielbühne"></canvas>
<button id="btnPause" class="iconbtn" aria-label="Pause" hidden>❚❚</button>
<div id="pad" hidden>
  <button id="btnDouse" class="ab douse" aria-label="Abdunkeln"><span class="ico">◐</span><span class="key">Shift</span></button>
  <button id="btnFlare" class="ab flare" aria-label="Aufflackern"><span class="ico">✺</span><span class="key">Leertaste</span></button>
</div>
<div id="hint" role="status" aria-live="polite"></div>
<div id="banner" aria-hidden="true"></div>
<main id="ui"></main>
<div id="curtainL" class="curtain closed" aria-hidden="true"></div>
<div id="curtainR" class="curtain closed" aria-hidden="true"></div>
<script type="module" src="main.js"></script>
</body>
</html>
